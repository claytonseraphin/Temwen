default_model: qwen-local

models:
  qwen-local:
    provider: openai-compatible
    url: http://localhost:8080/v1/chat/completions
    model: default_model
    max_tokens: 250
    temperature: 0.3
    timeout: 60s
    extra:
      chat_template_kwargs:
        enable_thinking: false

  claude-haiku:
    provider: anthropic
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 250
    temperature: 0.3
    timeout: 30s


witnesses:
  w1:
    name: "Colony and Revolution"
    era: { start: null, end: "1804-01-01" }
    prompt: ../prompts/witness-1.md
    prompt_version: v3
    source_shelf: w1          # matches the `era` tag on chunks in Postgres
    handoff_to: [w2]
    voice: kreyol-voice-a
  w2:
    name: "Early Nation and the Debt"
    era: { c}
    prompt: ../prompts/witness-2.md
    prompt_version: v1
    source_shelf: w2
    handoff_to: []
    voice: kreyol-voice-b,
